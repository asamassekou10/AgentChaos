name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The demos are the end-to-end proof that the engine reaches the right
      # verdict. The vulnerable agent must fail and the safe one must pass, so
      # both exit codes are asserted rather than just run.
      - name: Demo — vulnerable agent must fail
        run: |
          if node dist/cli/index.js test --config examples/demo-agent/vulnerable.yaml; then
            echo "::error::vulnerable demo exited 0; it must exit 1"
            exit 1
          fi

      - name: Demo — safe agent must pass
        run: node dist/cli/index.js test --config examples/demo-agent/safe.yaml
